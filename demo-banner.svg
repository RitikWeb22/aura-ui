<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#07080d" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #8b5cf6); }
      }
      @keyframes meteorTrail {
        0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translate(-220px, 220px) scale(1); opacity: 0; }
      }
      @keyframes sweepShine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .floating { animation: floatSlow 6s ease-in-out infinite; }
      .pulsing { animation: pulseBeam 4s ease-in-out infinite; }
      .meteor1 { animation: meteorTrail 4s linear infinite; }
      .meteor2 { animation: meteorTrail 5.5s linear infinite 2s; }
      .shining { animation: sweepShine 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#07080d" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Matrix Dots Pattern -->
  <g opacity="0.15">
    <pattern id="gridDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" />
    </pattern>
    <rect width="1200" height="630" fill="url(#gridDots)" />
  </g>

  <!-- Meteors Animation -->
  <g class="meteor1" transform="translate(1050, 40)">
    <line x1="0" y1="0" x2="-80" y2="80" stroke="url(#accentBeam)" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#glowLight)" />
  </g>
  <g class="meteor2" transform="translate(750, 20)">
    <line x1="0" y1="0" x2="-70" y2="70" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="350" cy="220" r="220" fill="#7c3aed" opacity="0.12" filter="url(#glowLight)" />
  <circle cx="950" cy="400" r="200" fill="#06b6d4" opacity="0.08" filter="url(#glowLight)" />

  <!-- Main Container Card -->
  <g transform="translate(60, 40)" filter="url(#shadowLg)">
    <!-- Window Border & Body -->
    <rect width="1080" height="550" rx="24" fill="#0e1017" stroke="#1e2230" stroke-width="1.5" />

    <!-- Window Topbar -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="6" fill="#ef4444" />
      <circle cx="28" cy="8" r="6" fill="#f59e0b" />
      <circle cx="48" cy="8" r="6" fill="#10b981" />
      <rect x="74" y="0" width="160" height="16" rx="8" fill="#171924" />
      <text x="154" y="12" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle" font-weight="600">aura-ui-library@2.3.0</text>
    </g>

    <!-- Top Floating Navbar Component Preview -->
    <g transform="translate(260, 16)">
      <rect width="560" height="38" rx="19" fill="#121520" stroke="#252a3d" stroke-width="1" />
      <!-- Logo -->
      <circle cx="24" cy="19" r="8" fill="url(#accentBeam)" />
      <text x="40" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Aura UI</text>
      <!-- Nav items -->
      <text x="150" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Components</text>
      <path d="M222 20 L226 24 L230 20" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="256" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Motion</text>
      <text x="320" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Templates</text>
      <!-- Pill Action Button -->
      <rect x="440" y="7" width="105" height="24" rx="12" fill="url(#accentBeam)" />
      <text x="492" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Get Started →</text>
    </g>

    <!-- Hero Header Text inside Preview -->
    <g transform="translate(60, 110)">
      <!-- Badge -->
      <g>
        <rect width="248" height="26" rx="13" fill="#1e1838" stroke="#4c1d95" stroke-width="1" />
        <circle cx="16" cy="13" r="4" fill="#a855f7" class="pulsing" />
        <text x="28" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">ZERO RUNTIME DEPENDENCIES</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="62" fill="url(#headerGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="-1">
        Cinematic Interfaces for Modern React
      </text>
      <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400">
        3D Coverflow Carousel • Cursor Spotlight BentoGrid • Native 120 FPS Motion Engine • 56+ Inline Icons
      </text>
    </g>

    <!-- Bento Grid Showcase (Cards Grid) -->
    <g transform="translate(60, 230)">
      
      <!-- Card 1: 3D Coverflow Carousel Interactive Card (col-span 2) -->
      <g transform="translate(0, 0)">
        <rect width="480" height="260" rx="18" fill="url(#cardGrad1)" stroke="#3730a3" stroke-width="1.2" />
        
        <!-- Radial Spotlight Glow -->
        <circle cx="240" cy="130" r="160" fill="#818cf8" opacity="0.08" />

        <g transform="translate(24, 24)">
          <!-- Card Header & Badge -->
          <rect width="72" height="20" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="0.8" />
          <text x="36" y="14" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">3D CAROUSEL</text>
          
          <text x="0" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Cover Flow Deck</text>
          <text x="0" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Interactive 3D depth, perspective peek, &amp; zero-lag rotation.</text>

          <!-- 3D Carousel Mini Mockup -->
          <g transform="translate(20, 90)">
            <!-- Left Card (peek & rotate) -->
            <rect x="20" y="10" width="100" height="90" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1" transform="matrix(0.85 0 -0.15 0.9 0 0)" opacity="0.6" />
            <!-- Right Card (peek & rotate) -->
            <rect x="270" y="10" width="100" height="90" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1" transform="matrix(0.85 0 0.15 0.9 0 0)" opacity="0.6" />
            <!-- Active Center Card (Elevated) -->
            <g filter="url(#shadowLg)" class="floating">
              <rect x="135" y="0" width="160" height="105" rx="12" fill="#1e2238" stroke="#818cf8" stroke-width="1.5" />
              <rect x="150" y="16" width="40" height="8" rx="4" fill="#6366f1" />
              <rect x="150" y="32" width="110" height="6" rx="3" fill="#334155" />
              <rect x="150" y="44" width="85" height="6" rx="3" fill="#334155" />
              <circle cx="260" cy="78" r="14" fill="url(#accentBeam)" />
              <path d="M256 78 L264 78 M260 74 L264 78 L260 82" stroke="#fff" stroke-width="1.5" fill="none" />
            </g>
          </g>
        </g>
      </g>

      <!-- Card 2: Bento Spotlight Glow (col-span 1) -->
      <g transform="translate(504, 0)">
        <rect width="230" height="260" rx="18" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.2" />
        
        <!-- Glowing cursor position simulation -->
        <circle cx="150" cy="110" r="110" fill="#06b6d4" opacity="0.12" filter="url(#glowLight)" />

        <g transform="translate(20, 24)">
          <rect width="64" height="20" rx="10" fill="#0e3a47" stroke="#0891b2" stroke-width="0.8" />
          <text x="32" y="14" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">SPOTLIGHT</text>

          <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Cursor Physics</text>
          <text x="0" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">GPU-accelerated mouse tracking without re-renders.</text>

          <!-- Interactive cursor icon -->
          <g transform="translate(130, 110)">
            <path d="M0 0 L16 16 L10 17 L14 26 L10 28 L6 19 L0 23 Z" fill="#ffffff" stroke="#000000" stroke-width="1" />
            <circle cx="0" cy="0" r="16" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,3" />
          </g>

          <rect x="0" y="170" width="190" height="40" rx="10" fill="#131b2c" stroke="#1e293b" stroke-width="1" />
          <text x="12" y="195" fill="#38bdf8" font-family="monospace" font-size="11">--mouse-x: 150px</text>
        </g>
      </g>

      <!-- Card 3: Magnetic & Physics Primitives (col-span 1) -->
      <g transform="translate(754, 0)">
        <rect width="206" height="260" rx="18" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1.2" />

        <g transform="translate(20, 24)">
          <rect width="70" height="20" rx="10" fill="#3b1d28" stroke="#be185d" stroke-width="0.8" />
          <text x="35" y="14" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MAGNETIC</text>

          <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Tactile Springs</text>
          <text x="0" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Euler spring damping and 3D gyro tilt cards.</text>

          <!-- Magnetic Button Element Mockup -->
          <g transform="translate(15, 115)">
            <rect width="140" height="42" rx="21" fill="url(#accentBeam)" filter="url(#glowLight)" opacity="0.9" />
            <text x="70" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Attract Cursor ⚡</text>
          </g>

          <!-- Badges below -->
          <g transform="translate(0, 185)">
            <rect width="80" height="22" rx="6" fill="#1f2438" />
            <text x="40" y="15" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">56+ SVGs</text>

            <rect x="90" y="0" width="80" height="22" rx="6" fill="#1f2438" />
            <text x="130" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">0 Runtime Deps</text>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
